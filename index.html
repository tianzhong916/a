<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stream Viewer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stream Viewer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#0f1014;--panel:#171922;--line:#2a2d3a;--fg:#ecedf3;--mute:#9a9db0;--tw:#9b6bff;--yt:#ff5a4f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column}
header{padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
form{display:flex;gap:6px;flex:1 1 320px}
input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:8px 10px;font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--tw);outline-offset:1px}
button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{border-color:var(--mute)}
button.primary{background:var(--tw);border-color:var(--tw);color:#fff;font-weight:600}
#notice{padding:8px 12px;background:#3a2a14;color:#ffd9a0;font-size:13px}
#notice[hidden],.ch[hidden]{display:none}
#favs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:44px;align-items:center}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.chip button{border:0;border-radius:0;background:none;padding:4px 10px}
.chip button.rm{padding:4px 8px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.hint{color:var(--mute);font-size:13px}
#grid{flex:1;display:grid;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));min-height:0;grid-auto-rows:minmax(260px,1fr)}
#grid.n2,#grid.n3,#grid.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
#grid:empty::before{content:"上の入力欄にTwitchのチャンネル名かURL、YouTubeの動画・ライブのURLを貼ってね。";color:var(--mute);padding:24px}
.tile{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;min-height:0}
.bar{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:var(--panel);gap:8px}
.bar b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar span{display:flex;gap:4px;flex:none}
.bar button{padding:2px 8px}
.body{flex:1;display:flex;min-height:0}
.body iframe{border:0;width:100%;height:100%;min-height:200px}
.pl{flex:1 1 65%}
.ch{flex:1 1 35%;min-width:220px}
@media(max-width:760px){
 #grid.n2,#grid.n3,#grid.n4{grid-template-columns:1fr}
 .body{flex-direction:column}
 .pl{aspect-ratio:16/9;flex:none;height:auto}
 .ch{flex:1;min-height:240px}
 #grid{grid-auto-rows:auto}
}
</style>
</head>
<body>
<header>
  <form id="f">
    <input id="q" placeholder="Twitchのチャンネル名/URL、YouTubeの動画・ライブURL" autocomplete="off" aria-label="配信を追加">
    <button class="primary" type="submit">追加</button>
  </form>
  <span class="hint" id="msg" role="status"></span>
</header>
<div id="notice" hidden>このページはhttps://のURLかlocalhostで開いてね。file://だとTwitchの埋め込みが映らないよ。</div>
<div id="favs" aria-label="お気に入り"></div>
<main id="grid"></main>

<script>
const HOST = location.hostname;
const MAX = 4;
const grid = document.getElementById('grid');
const msg = document.getElementById('msg');
let tiles = [];
let favs = loadFavs();

if (!HOST) document.getElementById('notice').hidden = false;

function loadFavs(){ try { return JSON.parse(localStorage.getItem('sv_favs')) || []; } catch(e){ return []; } }
function saveFavs(){ try { localStorage.setItem('sv_favs', JSON.stringify(favs)); } catch(e){} }
function say(t){ msg.textContent = t; clearTimeout(say.t); say.t = setTimeout(()=>msg.textContent='', 4000); }

function parse(s){
  s = s.trim(); if(!s) return null;
  let m;
  if (/twitch\.tv\/videos\//i.test(s)) return null;
  if (m = s.match(/twitch\.tv\/(?:popout\/)?([A-Za-z0-9_]{2,25})/i)) return {t:'twitch', id:m[1].toLowerCase()};
  if (m = s.match(/(?:youtu\.be\/|[?&]v=|\/live\/|\/embed\/)([\w-]{11})/)) return {t:'yt', id:m[1]};
  if (m = s.match(/youtube\.com\/channel\/(UC[\w-]{22})/)) return {t:'ytch', id:m[1]};
  if (/^UC[\w-]{22}$/.test(s)) return {t:'ytch', id:s};
  if (/^[A-Za-z0-9_]{2,25}$/.test(s)) return {t:'twitch', id:s.toLowerCase()};
  return null;
}
const key = x => x.t + ':' + x.id;
const label = x => (x.t === 'twitch' ? 'Twitch' : 'YouTube') + ': ' + x.id;
const color = x => x.t === 'twitch' ? 'var(--tw)' : 'var(--yt)';

function playerSrc(x){
  if (x.t === 'twitch') return `https://player.twitch.tv/?channel=${x.id}&parent=${HOST}&muted=true`;
  if (x.t === 'yt') return `https://www.youtube.com/embed/${x.id}?autoplay=1&mute=1`;
  return `https://www.youtube.com/embed/live_stream?channel=${x.id}&autoplay=1&mute=1`;
}
function chatSrc(x){
  if (x.t === 'twitch') return `https://www.twitch.tv/embed/${x.id}/chat?parent=${HOST}&darkpopout`;
  if (x.t === 'yt') return `https://www.youtube.com/live_chat?v=${x.id}&embed_domain=${HOST}&dark_theme=1`;
  return null;
}

function addTile(x){
  if (tiles.some(t => key(t.x) === key(x))) return say('もう追加してあるよ');
  if (tiles.length >= MAX) return say(`同時に観れるのは${MAX}つまで`);
  const el = document.createElement('section');
  el.className = 'tile';
  el.innerHTML = `<div class="bar"><b></b><span>
    <button data-a="fav" title="お気に入りに保存">★</button>
    <button data-a="chat" title="チャット表示">チャット</button>
    <button data-a="x" title="閉じる" aria-label="閉じる">✕</button></span></div>
    <div class="body"><iframe class="pl" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe><iframe class="ch" hidden></iframe></div>`;
  el.querySelector('b').textContent = label(x);
  el.querySelector('.pl').src = playerSrc(x);
  if (!chatSrc(x)) el.querySelector('[data-a=chat]').hidden = true;
  el.addEventListener('click', e => {
    const a = e.target.dataset.a; if (!a) return;
    if (a === 'x') { tiles = tiles.filter(t => t.el !== el); el.remove(); layout(); }
    if (a === 'fav') addFav(x);
    if (a === 'chat') {
      const ch = el.querySelector('.ch');
      if (!ch.src) ch.src = chatSrc(x);
      ch.hidden = !ch.hidden;
    }
  });
  tiles.push({x, el});
  grid.appendChild(el);
  layout();
}
function layout(){ grid.className = 'n' + tiles.length; }

function addFav(x){
  if (favs.some(f => key(f) === key(x))) return say('お気に入りに入ってるよ');
  favs.push(x); saveFavs(); renderFavs(); say('お気に入りに保存したよ');
}
function renderFavs(){
  const box = document.getElementById('favs');
  box.innerHTML = '';
  if (!favs.length) { box.innerHTML = '<span class="hint">タイルの★でお気に入りに保存できるよ</span>'; return; }
  favs.forEach((f, i) => {
    const c = document.createElement('span'); c.className = 'chip';
    const b = document.createElement('button');
    const d = document.createElement('i'); d.className = 'dot'; d.style.background = color(f);
    b.append(d, f.id); b.onclick = () => addTile(f);
    const r = document.createElement('button'); r.className = 'rm'; r.textContent = '✕';
    r.setAttribute('aria-label', f.id + 'を削除');
    r.onclick = () => { favs.splice(i, 1); saveFavs(); renderFavs(); };
    c.append(b, r); box.appendChild(c);
  });
}

document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('q');
  const x = parse(input.value);
  if (!x) return say('読み取れなかったよ。チャンネル名かURLを確認してね(@ハンドルのURLは非対応)');
  addTile(x); input.value = '';
});

renderFavs();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
